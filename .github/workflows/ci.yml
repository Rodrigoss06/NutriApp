# Integración continua (Notion 01 §6): cada pull request y cada fusión en main.
# Cuatro jobs: la puerta rápida (lint, arquitectura, tipos, unitarias y build), la integración con
# PostgreSQL 18 en Testcontainers, el esquema de base (migraciones desde cero y db pull sin cambios) y la
# interfaz con Playwright y axe sobre el build de producción.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, arquitectura, tipos, pruebas y build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Sin `version`: toma la de packageManager en package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Caché de Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Reglas de arquitectura
        run: pnpm lint:arch

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: Integración con PostgreSQL 18 (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Base desechable por corrida, como app_user (RNF-12, RN-A01). Docker ya está en el runner.
      - name: Pruebas de integración
        run: pnpm test:int

  database-schema:
    name: Esquema de base desde cero
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Solo la base local del compose: contraseñas de desarrollo, no secretos.
      DATABASE_OWNER_URL: postgresql://app_owner:app_owner_local@127.0.0.1:5432/nutricoach
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Levantar PostgreSQL 18 con infra/db/init
        run: |
          pnpm db:up
          for i in $(seq 1 60); do
            docker compose -f infra/docker/compose.local.yml exec -T -e PGPASSWORD=app_owner_local postgres \
              psql -h 127.0.0.1 -U app_owner -d nutricoach -Atc 'select 1' && exit 0
            sleep 2
          done
          exit 1

      - name: Migraciones desde una base vacía
        run: pnpm db:migrate

      # ADR-011 y ADR-024: schema.prisma es generado; si db pull lo cambia, falta una migración o un pull.
      - name: db pull no cambia schema.prisma
        run: |
          pnpm db:pull
          git diff --exit-code -- apps/api/prisma/schema.prisma

  ui-e2e:
    name: Interfaz con Playwright y axe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium para Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build de producción de la web
        run: pnpm turbo run build --filter web

      # RNF-18: axe sin violaciones graves en el catálogo (también con marcas extremas) y en las pantallas base.
      - name: Playwright en escritorio y móvil
        run: pnpm e2e

      - name: Guardar el reporte si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
