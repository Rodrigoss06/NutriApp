packages:
  - apps/*
  - packages/*

# Versiones compartidas: los package.json usan "catalog:".
# Prisma y pg-boss van fijos: sus migraciones y su SQL dependen de la versión exacta (ADR-024).
# TypeScript se queda en 6.0 mientras typescript-eslint no soporte TypeScript 7.
catalog:
  '@axe-core/playwright': ^4.13.0
  '@eslint/js': ^10.0.1
  '@nestjs-cls/transactional': ^4.0.1
  '@nestjs-cls/transactional-adapter-prisma': ^2.0.1
  '@nestjs/cli': ^12.0.8
  '@nestjs/common': ^12.1.2
  '@nestjs/core': ^12.1.2
  '@nestjs/platform-express': ^12.1.2
  '@nestjs/testing': ^12.1.2
  '@next/eslint-plugin-next': ^16.3.8
  '@playwright/test': 1.63.0
  '@prisma/adapter-pg': 7.10.0
  '@prisma/client': 7.10.0
  '@swc/cli': ^0.8.1
  '@swc/core': ^1.16.13
  '@tailwindcss/postcss': ^4.3.3
  '@testcontainers/postgresql': ^12.2.0
  '@testing-library/react': ^16.3.3
  '@types/express': ^5.0.6
  '@types/node': ^24.19.1
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/supertest': ^7.2.1
  '@vitest/coverage-v8': ^5.0.3
  chokidar: ^5.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dependency-cruiser: ^18.5.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint: ^10.12.0
  fast-check: ^4.10.2
  globals: ^17.13.0
  happy-dom: ^20.14.5
  lucide-react: ^1.52.0
  nestjs-cls: ^7.0.1
  nestjs-pino: ^5.3.1
  next: ^16.3.8
  pg-boss: 12.37.0
  pg: ^8.23.1
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  pino: ^10.4.0
  prettier: ^3.9.9
  prisma: 7.10.0
  radix-ui: ^1.7.0
  react-dom: ^19.3.0
  react: ^19.3.0
  recharts: ^3.10.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  server-only: ^0.0.1
  supertest: ^7.3.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  testcontainers: ^12.2.0
  turbo: ^2.11.7
  typescript-eslint: ^8.71.0
  typescript: ~6.0.3
  unplugin-swc: ^2.0.0
  uuid: ^14.0.2
  vite: ^8.3.2
  vitest: ^5.0.3
  zod: ^4.6.5

# pnpm 10 no ejecuta scripts de instalación salvo los de esta lista.
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

# Nombres cortos en node_modules/.pnpm: con peers opcionales (Playwright en next) la carpeta superaba los 160
# caracteres y Turbopack no encontraba next/package.json.
virtualStoreDirMaxLength: 60
